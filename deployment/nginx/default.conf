server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    client_max_body_size 100M;

    # Enable directory listing logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    # Add headers for debugging
    add_header X-Debug-Root $document_root always;
    add_header X-Debug-URI $uri always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # fastcgi_params sets HTTP_HOST to nginx's $host, which STRIPS the port.
        # Laravel builds asset()/route() URLs from the request host, so on any
        # non-standard port (e.g. the local docker map 8090:80) every asset URL
        # came out as http://127.0.0.1/... and 404'd — the page rendered unstyled.
        # $http_host is the client's Host header verbatim, port included.
        # Production is unchanged: Traefik forwards "www.foodie.humucare.co.uk"
        # with no port, so the generated URLs stay port-less there.
        fastcgi_param HTTP_HOST $http_host;


        # Increase timeouts to prevent Bad Gateway errors
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }


    # Cache static assets for 1 hour
    location ~* \.(js|css|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Don't cache HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
